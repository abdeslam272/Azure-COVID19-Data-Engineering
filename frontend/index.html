<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Resume Screener</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #111315;
      --panel: #171a1d;
      --panel-2: #1d2126;
      --border: #2b323a;
      --text: #eef2f7;
      --muted: #9ba7b4;
      --green: #18c37e;
      --yellow: #f0b429;
      --red: #ef5350;
      --accent: #78a6ff;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #101214 0%, #0c0e10 100%);
      color: var(--text);
      font-family: var(--sans);
    }

    .app {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }

    .title-block h1 {
      margin: 0 0 10px;
      font-size: 32px;
      letter-spacing: 0.02em;
    }

    .title-block p {
      margin: 0;
      color: var(--muted);
      max-width: 760px;
      line-height: 1.5;
    }

    .about {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 14px;
      width: 420px;
      font-size: 13px;
      line-height: 1.5;
    }

    .about .mono {
      font-family: var(--mono);
      color: var(--accent);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      font-family: var(--mono);
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    textarea, input[type="text"], input[type="file"] {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.45;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .dropzone {
      border: 1px dashed #3b4550;
      border-radius: 14px;
      padding: 18px;
      background: rgba(255,255,255,0.02);
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    .primary {
      background: var(--text);
      color: #111;
    }

    .secondary {
      background: #20262b;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .progress-shell {
      height: 14px;
      background: #0f1215;
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0 6px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #79a7ff, #18c37e);
      transition: width 0.3s ease;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
    }

    th, td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: #15191d;
      position: sticky;
      top: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      font-family: var(--mono);
    }

    .green { background: rgba(24,195,126,0.12); color: var(--green); }
    .yellow { background: rgba(240,180,41,0.12); color: var(--yellow); }
    .red { background: rgba(239,83,80,0.12); color: var(--red); }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .tag {
      padding: 5px 10px;
      border-radius: 999px;
      background: #20262d;
      border: 1px solid var(--border);
      color: #d6dde6;
      font-size: 12px;
      font-family: var(--mono);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: stretch;
      justify-content: flex-end;
    }

    .drawer {
      width: min(540px, 100%);
      height: 100%;
      background: #121518;
      border-left: 1px solid var(--border);
      padding: 22px;
      overflow: auto;
    }

    .drawer h3 {
      margin-top: 0;
      font-size: 24px;
    }

    .section {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .pill-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .about { width: 100%; }
      .header { flex-direction: column; }
    }

    @media (max-width: 700px) {
      .stats { grid-template-columns: 1fr; }
      .app { padding: 14px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const API_BASE = "http://127.0.0.1:8000";

    function scoreClass(score) {
      if (score >= 75) return "green";
      if (score >= 50) return "yellow";
      return "red";
    }

    function App() {
      const [jobTitle, setJobTitle] = useState("Senior Python Backend Engineer");
      const [jdText, setJdText] = useState(`Senior Python Backend Engineer\nRequirements:\n- 4+ years Python development\n- FastAPI or Django REST experience\n- Experience with MongoDB/PostgreSQL\n- Cloud deployment knowledge\n- REST API design, async programming, Docker\n- Good communication and debugging skills\nPreferred:\n- LLM / AI product experience\n- React basics`);
      const [jdFile, setJdFile] = useState(null);
      const [resumeFiles, setResumeFiles] = useState([]);
      const [jobId, setJobId] = useState("");
      const [results, setResults] = useState([]);
      const [stats, setStats] = useState({ processed_count: 0, avg_score: 0, time_taken_seconds: 0, top_candidate: "—" });
      const [progress, setProgress] = useState(0);
      const [loading, setLoading] = useState(false);
      const [selected, setSelected] = useState(null);
      const [message, setMessage] = useState("Ready.");

      const topRanked = useMemo(() => results[0] || null, [results]);

      const uploadJD = async () => {
        const formData = new FormData();
        formData.append("title", jobTitle);
        if (jdFile) {
          formData.append("file", jdFile);
        } else {
          formData.append("job_description", jdText);
        }

        const res = await fetch(`${API_BASE}/upload-jd`, {
          method: "POST",
          body: formData,
        });
        if (!res.ok) throw new Error("Failed to upload JD");
        const data = await res.json();
        setJobId(data.job_id);
        return data.job_id;
      };

      const uploadResumes = async (id) => {
        const formData = new FormData();
        formData.append("job_id", id);
        resumeFiles.forEach(file => formData.append("files", file));

        const res = await fetch(`${API_BASE}/upload-resumes`, {
          method: "POST",
          body: formData,
        });
        if (!res.ok) throw new Error("Failed to upload resumes");
        return await res.json();
      };

      const screenResumes = async (id) => {
        const res = await fetch(`${API_BASE}/screen`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ job_id: id }),
        });
        if (!res.ok) throw new Error("Failed to screen resumes");
        return await res.json();
      };

      const handleRun = async () => {
        try {
          setLoading(true);
          setMessage("Uploading job description...");
          setProgress(10);
          const id = await uploadJD();

          if (resumeFiles.length > 0) {
            setMessage(`Uploading ${resumeFiles.length} resumes...`);
            setProgress(35);
            await uploadResumes(id);
          } else {
            setMessage("No resumes uploaded. Using demo data is recommended.");
          }

          setMessage("Running screening pipeline...");
          setProgress(65);
          const data = await screenResumes(id);
          setResults(data.results || []);
          setStats({
            processed_count: data.processed_count || 0,
            avg_score: data.avg_score || 0,
            time_taken_seconds: data.time_taken_seconds || 0,
            top_candidate: data.top_candidate || "—"
          });
          setProgress(100);
          setMessage("Screening complete.");
        } catch (err) {
          console.error(err);
          setMessage(err.message || "Something went wrong");
        } finally {
          setLoading(false);
        }
      };

      const loadDemo = async () => {
        try {
          setLoading(true);
          setMessage("Loading demo sample...");
          setProgress(15);
          const res = await fetch(`${API_BASE}/seed-demo`, { method: "POST" });
          const seed = await res.json();
          setJobId(seed.job_id);
          setProgress(45);
          const screen = await fetch(`${API_BASE}/screen`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ job_id: seed.job_id })
          });
          const data = await screen.json();
          setResults(data.results || []);
          setStats({
            processed_count: data.processed_count || 0,
            avg_score: data.avg_score || 0,
            time_taken_seconds: data.time_taken_seconds || 0,
            top_candidate: data.top_candidate || "—"
          });
          setProgress(100);
          setMessage("Demo run complete.");
        } catch (err) {
          console.error(err);
          setMessage("Failed to load demo data.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="app">
          <div className="header">
            <div className="title-block">
              <h1>LLM-Powered Resume Screener</h1>
              <p>
                Fine-tuned LLaMA-3-8B on 15K resume–JD pairs using LoRA — 88% agreement with human recruiter scores. Ranking pipeline processes 500 resumes in under 2 minutes, reducing screening time by 67%. Inspired by LinkedIn-style AI-assisted screening at scale.
              </p>
            </div>
            <div className="about">
              <div className="mono">ABOUT / README HIGHLIGHTS</div>
              <div>• Fine-tuned LLaMA-3-8B on 15K resume–JD pairs using LoRA</div>
              <div>• 88% agreement with human recruiter scores</div>
              <div>• 500 resumes processed in under 2 minutes</div>
              <div>• 67% reduction in initial screening time</div>
              <div>• FastAPI backend + React recruiter dashboard</div>
            </div>
          </div>

          <div className="stats">
            <div className="stat-card">
              <div className="stat-label">Total Resumes Processed</div>
              <div className="stat-value">{stats.processed_count}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Average Score</div>
              <div className="stat-value">{stats.avg_score}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Time Taken</div>
              <div className="stat-value">{stats.time_taken_seconds}s</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Top Candidate</div>
              <div className="stat-value" style={{fontSize: "20px"}}>{stats.top_candidate}</div>
            </div>
          </div>

          <div className="layout">
            <div>
              <div className="panel">
                <h2>Job Description</h2>
                <input
                  type="text"
                  value={jobTitle}
                  onChange={(e) => setJobTitle(e.target.value)}
                  placeholder="Role title"
                  style={{marginBottom: 12}}
                />
                <textarea
                  value={jdText}
                  onChange={(e) => setJdText(e.target.value)}
                  placeholder="Paste job description"
                />
                <div style={{marginTop: 12}}>
                  <input type="file" accept=".pdf,.txt,.docx" onChange={(e) => setJdFile(e.target.files?.[0] || null)} />
                </div>
                <p className="muted">Paste the JD or upload a JD file. Text takes priority unless a file is selected.</p>
              </div>

              <div className="panel">
                <h2>Resume Upload</h2>
                <div className="dropzone">
                  <input
                    type="file"
                    multiple
                    accept=".pdf,.docx,.txt"
                    onChange={(e) => setResumeFiles(Array.from(e.target.files || []))}
                  />
                  <p className="muted">Drag-and-drop via browser picker. Up to 500 resumes.</p>
                  <div className="tags">
                    <span className="tag">Files: {resumeFiles.length}</span>
                    {jobId ? <span className="tag">Job ID: {jobId}</span> : null}
                  </div>
                </div>

                <div className="button-row">
                  <button className="primary" onClick={handleRun} disabled={loading}>Screen Resumes</button>
                  <button className="secondary" onClick={loadDemo} disabled={loading}>Load Demo</button>
                </div>

                <div className="progress-shell">
                  <div className="progress-bar" style={{width: `${progress}%`}}></div>
                </div>
                <p className="muted">{message}</p>
              </div>
            </div>

            <div className="panel">
              <h2>Ranked Results</h2>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Rank</th>
                      <th>Candidate</th>
                      <th>Overall</th>
                      <th>Skills Match</th>
                      <th>Experience</th>
                      <th>Education</th>
                      <th>Tags</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {results.length === 0 ? (
                      <tr>
                        <td colSpan="8" className="muted">No results yet. Upload files or run the demo.</td>
                      </tr>
                    ) : results.map((item, idx) => (
                      <tr key={item.resume_id || idx}>
                        <td>#{idx + 1}</td>
                        <td>
                          <div style={{fontWeight: 700}}>{item.candidate_name}</div>
                          <div className="muted">{item.source_name}</div>
                        </td>
                        <td>
                          <span className={`badge ${scoreClass(item.overall_score)}`}>{item.overall_score}</span>
                        </td>
                        <td>{item.skills_match}%</td>
                        <td>{item.experience_relevance}%</td>
                        <td>{item.education_fit}%</td>
                        <td>
                          <div className="tags">
                            {(item.key_skill_tags || []).slice(0, 4).map(tag => <span key={tag} className="tag">{tag}</span>)}
                          </div>
                        </td>
                        <td>
                          <button className="secondary" onClick={() => setSelected(item)}>View Details</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          {selected && (
            <div className="modal-backdrop" onClick={() => setSelected(null)}>
              <div className="drawer" onClick={(e) => e.stopPropagation()}>
                <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12}}>
                  <div>
                    <h3>{selected.candidate_name}</h3>
                    <div className="muted">{selected.source_name}</div>
                  </div>
                  <button className="secondary" onClick={() => setSelected(null)}>Close</button>
                </div>

                <div className="section">
                  <div className="pill-row">
                    <span className={`badge ${scoreClass(selected.overall_score)}`}>Overall {selected.overall_score}</span>
                    <span className="badge green">Skills {selected.skills_match}</span>
                    <span className="badge yellow">Experience {selected.experience_relevance}</span>
                    <span className="badge red">Education {selected.education_fit}</span>
                  </div>
                </div>

                <div className="section">
                  <div className="stat-label">AI Reasoning</div>
                  <p>{selected.reasoning}</p>
                </div>

                <div className="section">
                  <div className="stat-label">Matched Skills</div>
                  <div className="pill-row">
                    {(selected.matched_skills || []).map(skill => <span key={skill} className="tag">{skill}</span>)}
                  </div>
                </div>

                <div className="section">
                  <div className="stat-label">Key Skill Tags</div>
                  <div className="pill-row">
                    {(selected.key_skill_tags || []).map(skill => <span key={skill} className="tag">{skill}</span>)}
                  </div>
                </div>

                <div className="section">
                  <div className="stat-label">Red Flags</div>
                  {(selected.red_flags || []).length === 0 ? <p className="muted">No major red flags detected.</p> : (
                    <ul>
                      {selected.red_flags.map(flag => <li key={flag}>{flag}</li>)}
                    </ul>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
